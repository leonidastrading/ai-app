name: Build UAI (Windows)

on:
  # Build only when you ask (Actions tab → Run workflow) or on a version tag —
  # not on every commit, to avoid burning build minutes.
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build installer
        env:
          # No signing certificate — produce an unsigned installer (like the
          # ad-hoc macOS build). Users click "More info → Run anyway" once.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UAI-Windows
          path: windows/dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.exe
