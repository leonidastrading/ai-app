name: Build UAI (Windows)

on:
  # Build only when you ask (Actions tab → Run workflow) or on a version tag —
  # not on every commit, to avoid burning build minutes.
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Write cloud config (Firebase + Google OAuth)
        shell: bash
        run: |
          cat > src/main/cloud-config.js <<EOF
          module.exports = {
            firebaseApiKey: "${{ secrets.FIREBASE_API_KEY }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            googleClientId: "${{ secrets.GOOGLE_CLIENT_ID }}",
            googleClientSecret: "${{ secrets.GOOGLE_CLIENT_SECRET }}",
          };
          EOF

      - name: Syntax-check renderer/main scripts
        run: |
          node --check src/renderer/renderer.js
          node --check src/renderer/galaxy.js
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/main/webview-preload.js
          node --check src/main/auth.js
          node --check src/main/cloud-config.js

      - name: Build installer and publish release
        env:
          # No signing certificate — produce an unsigned installer (like the
          # ad-hoc macOS build). Users click "More info → Run anyway" once.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Lets electron-builder publish a GitHub Release (installer + the
          # latest.yml feed that the in-app updater reads).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UAI-Windows
          path: windows/dist/*.exe
