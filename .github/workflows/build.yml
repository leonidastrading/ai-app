name: Build UAI

on:
  # Build only when you ask (Actions tab → Run workflow) or when you publish a
  # release tagged like mac-v0.2.0 — NOT on every commit, to avoid burning
  # macOS build minutes. (Plain v* tags belong to the Windows auto-updater.)
  workflow_dispatch:
  push:
    tags: ["mac-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build UAI.app
        env:
          UAI_VERSION: ${{ startsWith(github.ref, 'refs/tags/mac-v') && github.ref_name || '0.1.0' }}
          UAI_BUILD: ${{ github.run_number }}
        run: |
          export UAI_VERSION="${UAI_VERSION#mac-v}"
          ./scripts/build-app.sh

      - name: Smoke test (launches and stays running)
        run: |
          open build/UAI.app
          sleep 15
          pgrep -x UAI || { echo "UAI is not running after launch"; ls ~/Library/Logs/DiagnosticReports | grep -i uai || true; exit 1; }
          pkill -x UAI || true

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: UAI-macOS
          path: build/UAI.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/UAI.zip
          # Never mark a Mac release "Latest": the Windows auto-updater reads
          # the Latest release's latest.yml, which Mac releases don't have.
          make_latest: false
